name: Build VaultFiles APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VaultFiles
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q VaultFiles-github-build.zip -d build-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build-source/VaultFiles
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultFiles-APK
          path: build-source/VaultFiles/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
